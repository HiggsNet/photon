name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  tests:
    name: Test shared and Linux code
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...

  windows:
    name: Build Windows amd64 portable archive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(tr -d '\r\n' < VERSION)"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and validate portable archive
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: |
          set -eu
          version=snapshot
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then version="$GITHUB_REF_NAME"; fi
          commit="$(git rev-parse --short=12 HEAD)"
          describe="$(git describe --tags --always --dirty)"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.buildCommit=${commit} -X main.buildDescribe=${describe} -X main.buildDirty=false -X main.buildTime=${built_at}"
          mkdir -p build/windows-amd64 dist
          go build -trimpath -ldflags "$ldflags" -o build/windows-amd64/photon-windows.exe ./app/photon-windows
          bash docs/scripts/windows-portable-build.sh
          PHOTON_WINDOWS_EXE="$PWD/build/windows-amd64/photon-windows.exe" WINTUN_DLL="$PWD/build/windows-amd64/wintun.dll" bash docs/scripts/windows-portable-build-test.sh
          cp build/photon-windows-amd64.zip "dist/photon-${version}-windows-amd64.zip"
          cd dist
          sha256sum *.zip > photon-windows-amd64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: photon-windows-amd64
          path: |
            dist/*.zip
            dist/*.sha256

  windows-native:
    name: Test Windows amd64 natively
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: photon-windows-amd64
          path: dist
      - name: Verify and run portable executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checksum = (Get-Content dist/photon-windows-amd64.sha256 -Raw).Trim() -split '\s+', 2
          $archive = Join-Path dist $checksum[1]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $checksum[0]) { throw 'Archive checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath portable
          Push-Location portable
          try {
            foreach ($line in Get-Content SHA256SUMS) {
              $parts = $line -split '\s+', 2
              if ((Get-FileHash -LiteralPath $parts[1] -Algorithm SHA256).Hash.ToLowerInvariant() -ne $parts[0]) { throw "Checksum mismatch: $($parts[1])" }
            }
            & .\photon-windows.exe version
            if ($LASTEXITCODE -ne 0) { throw 'Portable executable failed' }
          } finally { Pop-Location }
      - name: Run common and Windows native tests
        run: go test -count=1 ./pkg/core/gossip ./pkg/core/host ./internal/photonwindows ./app/photon-windows

  build:
    name: Build linux-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          version="$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "release tag $GITHUB_REF_NAME does not match VERSION=$version" >&2
            exit 1
          }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          version=snapshot
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then version="$GITHUB_REF_NAME"; fi
          commit="$(git rev-parse --short=12 HEAD)"
          describe="$(git describe --tags --always --dirty)"
          dirty="false"
          if [ -n "$(git status --porcelain)" ]; then dirty="true"; fi
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.buildCommit=${commit} -X main.buildDescribe=${describe} -X main.buildDirty=${dirty} -X main.buildTime=${built_at}"
          out="dist/photon-${version}-${GOOS}-${GOARCH}"
          mkdir -p "$out"
          go build -trimpath -ldflags "$ldflags" -o "$out/photon" ./app/photon
          go build -trimpath -o "$out/photon-services" ./app/photon-services
          cp README.md config.example.yaml service.example.yaml contrib/photon-admin contrib/systemd/photon.service contrib/systemd/photon-admin.service "$out/"
          tar -C dist -czf "${out}.tar.gz" "$(basename "$out")"

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > "photon-${{ matrix.goos }}-${{ matrix.goarch }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: photon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  docker:
    name: Build Docker linux-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            goarch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          version="$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "release tag $GITHUB_REF_NAME does not match VERSION=$version" >&2
            exit 1
          }

      - name: Prepare image metadata
        id: meta
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=snapshot
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then version="$GITHUB_REF_NAME"; fi
          commit="$(git rev-parse --short=12 HEAD)"
          describe="$(git describe --tags --always --dirty)"
          dirty="false"
          if [ -n "$(git status --porcelain)" ]; then dirty="true"; fi
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "describe=${describe}" >> "$GITHUB_OUTPUT"
          echo "dirty=${dirty}" >> "$GITHUB_OUTPUT"
          echo "built_at=${built_at}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.meta.outputs.describe }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DIRTY=${{ steps.meta.outputs.dirty }}
            BUILD_TIME=${{ steps.meta.outputs.built_at }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ matrix.goarch }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.commit }}-${{ matrix.goarch }}

  docker-manifest:
    name: Publish Docker manifest
    needs: [docker, tests, windows-native]
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare image metadata
        id: meta
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=snapshot
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then version="$GITHUB_REF_NAME"; fi
          commit="${GITHUB_SHA::12}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish version manifest
        run: |
          docker buildx imagetools create \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-amd64" \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-arm64"

      - name: Publish commit manifest
        run: |
          docker buildx imagetools create \
            -t "${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.commit }}" \
            "${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.commit }}-amd64" \
            "${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.commit }}-arm64"

      - name: Publish latest manifest
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        run: |
          docker buildx imagetools create \
            -t "${{ steps.meta.outputs.image }}:latest" \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-amd64" \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-arm64"

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - tests
      - windows-native
      - build
      - docker-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: photon-*
          path: dist
          merge-multiple: true

      - name: Prepare release notes
        run: |
          set -eu
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            cp "$notes" dist/RELEASE_NOTES.md
          else
            printf '%s\n' 'Linux amd64/arm64、Windows amd64 安装包及 SHA256 校验文件见附件。' '含 -rc.N 的版本为预发布，不更新正式版或 Docker latest。' > dist/RELEASE_NOTES.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
