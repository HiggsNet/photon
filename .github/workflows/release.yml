name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build linux-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          version="$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "release tag $GITHUB_REF_NAME does not match VERSION=$version" >&2
            exit 1
          }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          version="${GITHUB_REF_NAME:-snapshot}"
          commit="$(git rev-parse --short=12 HEAD)"
          describe="$(git describe --tags --always --dirty)"
          dirty="false"
          if [ -n "$(git status --porcelain)" ]; then dirty="true"; fi
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X main.buildCommit=${commit} -X main.buildDescribe=${describe} -X main.buildDirty=${dirty} -X main.buildTime=${built_at}"
          out="dist/photon-${version}-${GOOS}-${GOARCH}"
          mkdir -p "$out"
          go build -trimpath -ldflags "$ldflags" -o "$out/photon" ./app/photon
          go build -trimpath -o "$out/photon-services" ./app/photon-services
          cp README.md config.example.yaml service.example.yaml contrib/photon-admin contrib/systemd/photon.service contrib/systemd/photon-admin.service "$out/"
          tar -C dist -czf "${out}.tar.gz" "$(basename "$out")"

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > "photon-${{ matrix.goos }}-${{ matrix.goarch }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: photon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  docker:
    name: Build Docker linux-${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            goarch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -eu
          version="$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "release tag $GITHUB_REF_NAME does not match VERSION=$version" >&2
            exit 1
          }

      - name: Prepare image metadata
        id: meta
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME:-snapshot}"
          commit="$(git rev-parse --short=12 HEAD)"
          describe="$(git describe --tags --always --dirty)"
          dirty="false"
          if [ -n "$(git status --porcelain)" ]; then dirty="true"; fi
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"
          echo "describe=${describe}" >> "$GITHUB_OUTPUT"
          echo "dirty=${dirty}" >> "$GITHUB_OUTPUT"
          echo "built_at=${built_at}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            VERSION=${{ steps.meta.outputs.describe }}
            COMMIT=${{ steps.meta.outputs.commit }}
            DIRTY=${{ steps.meta.outputs.dirty }}
            BUILD_TIME=${{ steps.meta.outputs.built_at }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ matrix.goarch }}
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.commit }}-${{ matrix.goarch }}

  docker-manifest:
    name: Publish Docker manifest
    needs: docker
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare image metadata
        id: meta
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME:-snapshot}"
          commit="${GITHUB_SHA::12}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish version manifest
        run: |
          docker buildx imagetools create \
            -t "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}" \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-amd64" \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-arm64"

      - name: Publish commit manifest
        run: |
          docker buildx imagetools create \
            -t "${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.commit }}" \
            "${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.commit }}-amd64" \
            "${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.commit }}-arm64"

      - name: Publish latest manifest
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
        run: |
          docker buildx imagetools create \
            -t "${{ steps.meta.outputs.image }}:latest" \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-amd64" \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-arm64"

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
      - docker-manifest
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: photon-*
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          body: |
            Linux amd64 / arm64 安装包及对应 SHA256 校验文件见附件。

            含 `-rc.N` 的版本为预发布测试版，不更新正式版或 Docker latest。
            Linux 新旧版本对照测试、安装和回退步骤见：
            https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/new/linux-release-testing.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
