# Photon example configuration.
#
# Copy this file to config.yaml and fill the identity/trust fields for the
# node you are running. The default runtime is deliberately conservative:
# gossip works as an unprivileged process. Runtime layers such as IPsec/XFRM,
# BIRD, firewall, health probes, and the observer are enabled by declaring their
# config blocks; set disabled: true to keep a block without reconciling it.

# -----------------------------------------------------------------------------
# 1. Local identity, state, and gossip
# -----------------------------------------------------------------------------

# Default data_dir is /etc/photon. Use a relative path for local development.
# data_dir: .photon

# Base64 encoded raw 32-byte ED25519 public key for the trusted root zone.
# CLI output uses base64; existing hex values are still accepted.
trusted_root_public_key:

# -----------------------------------------------------------------------------
# 2. Gossip identity, peers, limits, and endpoint discovery
# -----------------------------------------------------------------------------

gossip:
  # For a joined daemon node, prefer the zone FQDN as managed_zone and peer_id.
  # The first load with init.managed_zone + init.key_path can create a pending
  # bootstrap state and print a join request instead of embedding private key
  # material in config.yaml.
  # init:
  #   managed_zone: node-a.catofes.
  #   key_path: .photon/identity.key.json

  peer_id: node-a.catofes.
  listen_addr: "[::]:33434"

  bootstrap:
    - id: node-b.catofes.
      addr: 127.0.0.1:33435

  # Public-internet safe defaults. Photon does not depend on IP fragmentation.
  # max_datagram_bytes: 1200
  # max_sync_zones: 16
  # max_sync_records: 1024

  # Explicit publish addresses are preferred over reflector/interface discovery.
  # advertise_addrs:
  #   - 203.0.113.10:33434

  # Endpoint discovery modes:
  #   all             advertise_addrs + reflectors + interface scan
  #   loopback_only   only loopback listen/advertise addresses
  #   advertise_only  only explicit advertise_addrs
  # If unset and all bootstrap peers are loopback, daemon treats this as
  # loopback_only automatically.
  # endpoint_discovery: all
  # publish_endpoints: true

  # reflectors: auto
  # reflector_interval: 5m
  # reflector_timeout: 3s
  # endpoint_ttl: 3h
  # endpoint_refresh: 30m
  # endpoint_grace: 10m

  # Address source priority for outbound gossip endpoint selection.
  # endpoint_source_order:
  #   - advertise
  #   - bootstrap
  #   - reflector
  #   - interface

  # Exclude RFC1918 IPv4 addresses found by interface scan from signed endpoint
  # publication. Set false for private-network labs that intentionally publish
  # RFC1918 addresses.
  # filter_private_ipv4: true

# Runtime logs default to stderr. Set log.mode when a daemon should also copy
# structured logs to a file or syslog. Supported modes: stderr, file, syslog,
# stderr+file, stderr+syslog.
# Supported levels: debug, info, warn, error. PHOTON_LOG_LEVEL overrides this.
# log:
#   level: info
#   mode: stderr+file
#   file: /var/log/photon.log

# Dynamic peer lifecycle. cleanup_after removes the local SyncPeers cache and
# Photon-owned data-plane links after the peer has not synchronized or been
# observed for the configured window. A successful sync enables the peer again.
# peer_lifecycle:
#   stale_after: 15m
#   offline_after: 12h
#   cleanup_after: 48h
#   keep_sa_while_stale: true

# -----------------------------------------------------------------------------
# 3. Network namespaces, IPsec, and link policy
# -----------------------------------------------------------------------------

# Network namespaces are declared once here and referenced by overlays, BIRD
# routing instances, and firewall instances. `default` is the implicit netns
# for overlay link groups, routing instances, and non-host firewall instances
# when their netns field is omitted.
netns:
  default:
    name: photon
    # kind defaults to name and create defaults to true. Set create: false to
    # reuse an existing netns. Declaring forwarding enables transit; omit it to
    # disable transit.
    forwarding: {}
    # To restrict transit, use instead:
    # forwarding:
    #   allow_prefixes:
    #     - 10.42.0.0/16
    #   deny_prefixes:
    #     - 10.99.0.0/24

ipsec:
  # This section configures the local IPsec provider. It does not, by itself,
  # publish IPsec capability records. Photon publishes ipsec/* records only
  # when a local overlay/link group below selects provider: strongswan.
  #
  # role declares this node's IPsec mesh behavior: out, in, or both.
  # It also determines whether this node initiates links.
  # Default is both (accept and initiate links).
  # role: both
  #
  # Default driver is strongswan. For unprivileged development or CI without
  # charon/VICI/XFRM, explicitly set driver: dry-run.
  # driver: strongswan
  # Photon does not manage charon directly; strongswan mode connects to an
  # existing VICI socket. The packaged photon.service wants and orders itself
  # after strongswan.service; other launch methods must start charon separately.
  # Empty uses govici/strongSwan's default socket path.
  # vici_socket: /run/charon.vici

  # fixed publishes the charon listener ports directly. range publishes
  # deterministic, non-overlapping IKE/NAT-T port pairs from port_range while
  # charon keeps its stable local 500/4500 sockets. Each generation advances by
  # one pair (two ports); the range must contain at least four ports. In range
  # mode, host firewall instances
  # default host_ports.ike/natt and redirect_grace to enabled so advertised
  # entry ports DNAT back to charon and outbound charon source ports are
  # rewritten to current advertised ports; explicitly disable them if another
  # firewall manager owns those rules. Previous advertised ports are published
  # during grace.
  # port_mode: fixed
  # port_range:
  #   from: 30000
  #   to: 30099
  # port_rotate_interval: 24h
  # port_previous_grace: 10m

  # IPsec-specific addresses and DNS names to publish, independent of the
  # gossip.advertise_addrs used for gossip. announce_addrs are published as
  # manual-address; announce_dns are published as manual-dns and resolved by
  # peers. announce_gossip_endpoints (default true) also publishes addresses from
  # gossip endpoint discovery (reflector + interface scan) as discovery/reflector
  # /local sources.
  # announce_addrs:
  #   - 203.0.113.10
  #   - 2001:db8::10
  # announce_dns:
  #   - vpn.example.com
  # If an initiator's established SA still uses an address removed from its own
  # announce_dns and has received no traffic for this long, rebuild the SA.
  # Set to 0 to disable. Default: 5m.
  # announce_dns_reconnect_after: 5m
  # announce_gossip_endpoints: true

# Uncomment an overlay/link group to participate in the StrongSwan mesh. This
# is the switch that makes the daemon publish signed node-level ipsec/profile,
# ipsec/addresses, ipsec/ports, ipsec/transport-key records plus
# ipsec/overlays/<overlay_id> intent records for this node.
# Future providers such as WireGuard should be configured as their own provider
# family, not under the ipsec: provider settings.
#
# overlays:
#   - id: ipsec-main
#     name: ipsec-main
#     # provider defaults to strongswan. It is the overlay transport provider,
#     # not the generic "ipsec" record namespace name.
#     # provider: strongswan
#     # netns defaults to netns.default. Set a reference here only when this
#     # link group should use another declared netns.
#     # netns: default
#     # default_path_mode: family-redundant
#     # address_source_order:
#     #   - manual-address
#     #   - manual-dns
#     #   - discovery
#     #   - reflector
#     # max_peers defaults to unlimited. Set a positive value to cap selected
#     # peers in this link group.
#     # max_peers: 256
#     # max_links_per_peer: 2
#
#     # tunnel_address defaults to IPv6 derived-link-local, so this block is
#     # usually unnecessary. Modes:
#     #   derived-link-local  deterministic IPv6 fe80::/64 scoped address
#     #   derived-pool        deterministic address from tunnel_address.pool
#     #   sequential-pool     legacy index-based allocation for old configs/tests
#     #   disabled            no tunnel address
#     # tunnel_address:
#     #   mode: derived-pool
#     #   family: ipv6
#     #   pool: fd00:4242::/64
#
#     # reconcile is mostly event-driven; interval is only the periodic safety
#     # sweep for SA observation/recovery. Defaults: interval 1m,
#     # rotate_retention 1h. Backoff is retry throttle after failed provider
#     # apply, not normal reconcile frequency; default is exponential 1s..1m,
#     # and the next attempt still waits for an event or safety sweep.
#     # reconcile:
#     #   interval: 1m
#     #   rotate_retention: 1h
#     #   backoff:
#     #     initial: 1s
#     #     max: 1m
#
#     connect:
#       - "strongswan://*.catofes.?role=both&family=dual&source=manual-dns,discovery&mode=family-redundant"
#     deny:
#       - "strongswan://*.lab.catofes."

# -----------------------------------------------------------------------------
# 4. Per-netns BIRD/Babel routing and IPAM
# -----------------------------------------------------------------------------

# ipam:
#   # Persistently announce selected assignments owned by managed_zone.
#   # Unlisted shared assignments remain available to services or manual CLI.
#   announce:
#     - non-shared
#     # - tag:edge.c
#   # Legacy compatibility: true announces every local assignment, including
#   # shared assignments. Do not combine it with announce.
#   # auto_announce_assigned_ips: false

routing:
  instances:
    - id: main
      # netns defaults to netns.default. Set a reference only when this BIRD
      # instance should run in another declared netns.
      # netns: default
      # disabled: true
      # provider is the managed routing backend. "bird" runs BIRD with a Babel
      # protocol stanza inside the generated bird.conf; babeld is not supported.
      # provider: bird
      # mode: managed
      # shutdown_policy: persist  # persist keeps BIRD running across Photon restarts; use stop for lab teardown.
      # table: main
      # metric_base: 100
      # metric_staged: 1200
      # metric_draining: 2400
      # interface_pattern: phx*
      # Optional equal-cost multipath support. When enabled, BIRD renders
      # `ecmp on` (or `ecmp on limit N`) in the Babel protocol block.
      # ecmp: true
      # ecmp_limit: 16

      # Optional veth upstream for main-network Babel peering. Photon starts BIRD
      # in the routing instance netns; BIRD itself cannot switch namespaces
      # after start. The upstream veth mesh side also uses this instance netns.
      # If upstream is omitted, local assigned prefixes are exported with a
      # local blackhole route in this netns. If upstream is enabled, mode
      # defaults to static: local assigned prefixes are routed toward the veth.
      # mode: external only makes mesh-side BIRD listen on the veth; host-side
      # routing/BIRD is administrator-managed and Photon does not add static routes.
      # upstream:  # upstream: {} or any non-disabled upstream block enables it.
      #   mode: static  # static | external
      #   create_veth: true          # default true; set false for pre-created veth pairs
      #   # Install assignment-derived source identities on the external veth.
      #   # Defaults to true for static mode and false for external mode. In
      #   # external mode no remote static routes are added.
      #   install_source_addresses: false
      #   mesh:
      #     interface: phv2host     # routing instance netns side, toward host
      #     ipv4_ll: 169.254.254.1/30
      #     ipv6_ll: fe80::a1:1/64
      #   external:
      #     interface: phv2mesh    # host/upstream netns side, toward Photon
      #     netns: ""                # optional; empty = init/main host netns
      #     ipv4_ll: 169.254.254.2/30
      #     ipv6_ll: fe80::a1:2/64

# Application deployment is intentionally not part of the Photon daemon
# configuration. `photon-services` reads /etc/photon/service.yaml, queries the
# current IPAM state through the Photon CLI, and renders Docker Compose files.
# See service.example.yaml and docs/new/services.md.

# -----------------------------------------------------------------------------
# 5. Firewall, health probes, and read-only observer
# -----------------------------------------------------------------------------

firewall:
  instances:
    - id: photon
      # Non-host firewall instances default to netns.default.
      # netns: default
      # disabled: true
      # mode: managed
      # backend: auto
      # default_policy: drop
      # xfrm_tunnel_pattern: phx*
      # nft base-chain priorities. Defaults are filter, dstnat, and srcnat.
      # Effective only with backend: nft; each value is its required base plus
      # an optional spaced integer offset, for example "filter - 1".
      # priority:
      #   filter: "filter - 1"
      #   prerouting: "dstnat - 1"
      #   postrouting: "srcnat + 1"
      # Backend-native inline hooks. Configure either backend or both; auto
      # uses only the selected backend. Rule bodies never run through a shell.
      # nft_hooks:
      #   pre_input:
      #     - 'ip saddr 10.20.0.0/16 tcp dport 22 accept'
      # iptables_hooks:
      #   ipv4:
      #     pre_input:
      #       - '-s 10.20.0.0/16 -p tcp --dport 22 -j ACCEPT'
      #       - '-s 10.30.0.0/16 -p tcp --dport 443 -j ACCEPT'
      #   ipv6:
      #     pre_input:
      #       - '-s 2001:db8:20::/48 -p tcp --dport 22 -j ACCEPT'

    - id: host-ipsec
      host: true
      # This managed host instance also enforces dynamic service endpoint ACLs
      # on forwarded traffic to Docker bridges.
      # disabled: true
      # mode: managed
      # backend: auto
      # Listen addresses used for host ingress and DNAT/redirect rules.
      # Defaults to gossip.advertise_addrs. Set this when the host is behind
      # a gateway that DNATs public addresses to local addresses before packets
      # reach the local firewall; rules must then match the post-DNAT local IP.
      # listen_addrs:
      #   - 172.17.16.168
      # In ipsec.port_mode=range, these host IPsec ingress/redirect/source-port
      # rewrite settings default to enabled. Uncomment false/disabled values
      # only if external firewall rules own IKE/NAT-T and advertised-port NAT.
      # host_ports:
      #   ike: false
      #   natt: false
      # redirect_grace:
      #   disabled: true
      # nft_hooks:
      #   host_pre_input:
      #     - 'udp dport 51820 accept'
      # iptables_hooks:
      #   ipv4:
      #     host_pre_prerouting:
      #       - '-p tcp --dport 8080 -j REDIRECT --to-ports 18080'

