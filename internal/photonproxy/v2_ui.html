<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photon Proxy</title>
<link rel="stylesheet" href="/ui/style.css">
<script type="module" src="/ui/app.js"></script>
<header class="masthead">
  <div class="frame masthead-inner">
    <h1>Photon Proxy</h1>
    <form id="auth" class="line">
      <label>管理令牌 <input id="token" type="password" autocomplete="off"></label>
      <button>连接</button>
    </form>
  </div>
</header>
<main class="frame">
  <p id="status" role="status" aria-live="polite"></p>
  <section class="panel" aria-labelledby="routes-title">
    <div class="section-head">
      <h2 id="routes-title">SOCKS5 路径</h2>
      <div class="line">
        <button type="button" id="refresh">刷新</button>
        <button type="button" id="new-route" class="primary">新建路径</button>
      </div>
    </div>
    <p id="empty-routes" class="empty" hidden>暂无已保存路径</p>
    <ul id="routes" class="routes"></ul>
    <div id="route-test" class="test-panel" aria-labelledby="test-title" hidden>
      <div class="section-head">
        <h3 id="test-title"></h3>
        <button type="button" id="close-test">关闭测试</button>
      </div>
      <div class="probe-actions">
        <button type="button" data-probe="connectivity">连通性 <small>TCP · Google 204</small></button>
        <button type="button" data-probe="dns">UDP DNS <small>1.1.1.1</small></button>
        <button type="button" data-probe="download">下载测速 <small>Cloudflare · 4 MiB</small></button>
      </div>
      <p id="result" role="status" aria-live="polite"></p>
      <details>
        <summary>自定义测试目标</summary>
        <form id="custom-probe" class="test-fields">
          <label>协议 <select id="protocol"><option value="tcp">TCP 连接</option><option value="udp">UDP DNS</option></select></label>
          <label>测试目标 <input id="target" placeholder="例如 192.168.50.10:443" required></label>
          <button id="probe" class="primary">测试目标</button>
        </form>
      </details>
    </div>
  </section>
  <dialog id="route-editor" aria-labelledby="edit-title">
    <div class="section-head editor-bar">
      <h2 id="edit-title" tabindex="-1">新建路径</h2>
      <button id="close-editor" type="button" aria-label="关闭">×</button>
    </div>
    <p id="editor-status" role="status" aria-live="polite"></p>
    <div class="panels">
      <div>
        <form id="route-form">
          <div class="fields">
            <label>路径名 <input id="name" required maxlength="80"></label>
            <label>SOCKS5 监听地址 <input id="listen" aria-describedby="listen-hint" placeholder="留空使用默认地址"></label>
          </div>
          <p id="listen-hint" class="muted"></p>
          <div class="hop-group" role="group" aria-labelledby="relay-title">
            <div class="section-head">
              <h3 id="relay-title">中继 <small>可选</small></h3>
              <button type="button" id="add-relay">＋ 添加中继</button>
            </div>
            <div id="relays"></div>
          </div>
          <div class="hop-group" role="group" aria-labelledby="exit-title">
            <h3 id="exit-title">出口</h3>
            <div id="exit"></div>
          </div>
          <p id="preview" class="preview" hidden></p>
          <div class="line form-actions"><button type="button" id="reset">清空</button><button class="primary" id="save">创建路径</button></div>
        </form>
      </div>
      <section class="directory-panel" aria-labelledby="directory-title">
        <h3 id="directory-title">Gossip 节点目录</h3>
        <p id="directory-status" class="muted" role="status"></p>
        <div class="directory-group">
          <h4>出口</h4>
          <ul id="directory-exits" class="directory"></ul>
        </div>
        <div class="directory-group">
          <h4>中继</h4>
          <ul id="directory-relays" class="directory"></ul>
        </div>
      </section>
    </div>
  </dialog>
</main>
</html>
