syntax = "proto3";

package photon.gossip.v1;

option go_package = "github.com/HiggsNet/photon/pkg/core/gossip/gossippb";

message Message {
  string peer_id = 1;
  uint64 nonce = 2;
  int64 timestamp = 3;

  reserved 13;

  oneof body {
    Ping ping = 10;
    Pong pong = 11;
    FetchZone fetch_zone = 12;
    Announce announce = 14;
  }
}

message ZoneDigest {
  string zone = 1;
  bytes root_hash = 2;
}

message Ping {
  repeated ZoneDigest zones = 1;
}

message Pong {
  repeated string fetch_zones = 1;
}

message FetchZone {
  string zone = 1;
}

message Announce {
  repeated ZoneDigest zones = 1;
}
