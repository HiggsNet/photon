# Standalone photon-services manifest, normally /etc/photon/service.yaml.
# v2 treats http, socks5 and trusttunnel independently. Omit any block to
# disable it; omit all three for network-only operation.
version: 2

# output_dir: /etc/photon/services
images:
  mihomo: metacubex/mihomo:v1.19.34

# Use the actual host-side overlay ingress interface on this node.
network_defaults:
  trusted_host_interfaces: [phv2mesh]

networks:
  main:
    ipv4: "local;172.30.0.0/24;172.30.0.128/28;172.30.0.1"
    ipv6: "auto;::/112;::100/120;::1"
  # cn:
  #   ipv6: "tag:socks5.cn;::/112;::100/120;::1"

http:
  networks: {main: "::21"}
  publish: {main: local}
  port: 3128
  allow_zones: ["*.catofes."]
  resolver:
    mode: ipv4_first
    servers: [8.8.8.8, 1.1.1.1]
  # Optional Basic auth; without it, the Zone ACL controls access.
  # Credentials stay local. Authenticated HTTP nodes need explicit client
  # credentials and are not selected by the automatic client profile.
  # auth:
  #   username: photon
  #   password: replace-me

socks5:
  networks: {main: "::20"}
  publish: {main: local}
  # Optional Anycast publication if cn is configured above:
  # networks: {main: "::20", cn: "::20"}
  # publish: {main: local, cn: cn}
  port: 3128
  allow_zones: ["*.catofes."]
  resolver:
    mode: ipv4_first
    servers: [8.8.8.8, 1.1.1.1]

trusttunnel:
  networks: {main: "::22"}
  publish: {main: local}
  port: 4433
  allow_zones: ["*.catofes."]
  resolver:
    mode: ipv4_first
    servers: [8.8.8.8, 1.1.1.1]

# main's non-shared route normally remains managed by the daemon:
# config.yaml: ipam.announce: [non-shared]
# HTTP/SOCKS5 shared routes are managed by photon-services.
# TrustTunnel certificates and fingerprints are generated automatically.
